<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07030f;--card:#0d0618;--ink:#f3eefc;--muted:#b9a9d6;--accent:#ffb35f;--line:rgba(243,238,252,.16);--err:#ff8fcf;color-scheme:dark}
:root[data-tema="crema"]{--bg:#f7f1e3;--card:#fffbf1;--ink:#241a38;--muted:#62587a;--accent:#9a5200;--line:rgba(36,26,56,.18);--err:#a3004f;color-scheme:light}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(1px 1px at 12% 18%,rgba(243,238,252,.55),transparent),radial-gradient(1px 1px at 78% 9%,rgba(243,238,252,.4),transparent),radial-gradient(1.5px 1.5px at 91% 62%,rgba(243,238,252,.35),transparent),radial-gradient(1px 1px at 33% 84%,rgba(243,238,252,.4),transparent),radial-gradient(1px 1px at 55% 40%,rgba(243,238,252,.3),transparent),radial-gradient(1px 1px at 22% 58%,rgba(243,238,252,.3),transparent),radial-gradient(1px 1px at 66% 76%,rgba(243,238,252,.35),transparent)}
:root[data-tema="crema"] body{background-image:none}
/* Todo va bajo #gate: si algo de esta pantalla sobreviviera al abrir la página, no puede tocar sus estilos. */
#gate{min-height:100vh;display:grid;place-items:center;color:var(--ink);font:16px/1.5 "Instrument Sans",system-ui,sans-serif;padding:16px;box-sizing:border-box}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 28px 26px;width:100%;max-width:370px;box-sizing:border-box;box-shadow:0 26px 56px -28px rgba(0,0,0,.7)}
#gate .lg{display:flex;align-items:center;gap:12px;margin:0 0 4px}
#gate .lg svg{width:36px;height:36px;flex:none}
#gate h1{font:800 27px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:0}
#gate .by{font:800 14px/1 "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);margin:0 0 18px;opacity:.9}#gate .by b{color:var(--accent);font-weight:800}
#gate p{margin:0 0 16px;color:var(--muted);font-size:14px}
#gate input,#gate button{width:100%;box-sizing:border-box;font:inherit;padding:12px 14px}
#gate input{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;margin-bottom:12px;caret-color:var(--accent)}
#gate input:focus-visible,#gate button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#gate button{border:0;border-radius:999px;background:#ffb35f;color:#07030f;font-weight:600;cursor:pointer;transition:background .16s,transform .12s}
#gate button:hover{background:#ffc182}#gate button:active{transform:scale(.98)}#gate button:disabled{opacity:.6;cursor:default}
#gate #e{color:var(--err);font-size:13px;min-height:1.5em;margin:10px 0 0}
#gate form{animation:ent .5s cubic-bezier(.23,1,.32,1) both}@keyframes ent{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){#gate form{animation:none}}
</style></head><body>

const K="tf-k:"+D.s;
async function abrir(k){
  const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)));
  try{sessionStorage.setItem(K,btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",k)))))}catch(e){}

}
